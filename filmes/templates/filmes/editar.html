<h1>Editar filme</h1>
<form action="{% url 'salvar_edicao' filme.id %}" method="post">
    {% csrf_token %}
    <p>Título: <input name="titulo" value="{{ filme.titulo }}" required></p>
    <p>Gênero: <input name="genero" value="{{ filme.genero }}" required></p>
    <p>Ano: <input name="ano" type="number" value="{{ filme.ano }}" required></p>
    <p>
        <input name="assistido" type="checkbox" 
            {% if filme.assistido %}
                checked
            {% endif %}
        > 
            Já assisti
    </p>
    <button>Salvar</button>
</form>

<a href="{% url 'lista' %}">Voltar</a>
