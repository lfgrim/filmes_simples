<h1>Novo filme</h1>

<form action="{% url 'salvar_novo' %}" method="post">
    {% csrf_token %}
    <p>Título: <input name="titulo" required></p>
    <p>Gênero: <input name="genero" required></p>
    <p>Ano: <input name="ano" type="number" required></p>
    <p><input name="assistido" type="checkbox"> Já assisti</p>
    <button>Salvar</button>
</form>

<a href="{% url 'lista' %}">Voltar</a>
